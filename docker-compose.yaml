name: quark-cloud-drive

services:
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    image: ghcr.io/keiko233/quark-cloud-drive:latest
    container_name: quark-cloud-drive
    hostname: quark-cloud-drive
    platform: linux/amd64

    devices:
      - /dev/dri:/dev/dri # Intel/AMD GPU

    environment:
      # Set before startup, e.g. MESA_LOADER_DRIVER_OVERRIDE=iris or radeonsi.
      MESA_LOADER_DRIVER_OVERRIDE: "${MESA_LOADER_DRIVER_OVERRIDE:-}"

      # Wine runtime used for the bundled Quark build.
      QUARK_RUNTIME: "${QUARK_RUNTIME:-spark}"

      # One process owns everything: the manager is embedded (no HTTP hop, no
      # second container). Set QUARK_MANAGER_MODE=http to point a host-side
      # instance at this container's manager API instead.
      QUARK_MANAGER_MODE: "${QUARK_MANAGER_MODE:-embedded}"
      SERVER_PORT: "${SERVER_PORT:-3000}"
      QUARK_API_PORT: "${QUARK_API_PORT:-8080}"
      QUARK_AUTOSTART: "${QUARK_AUTOSTART:-true}"

      # The KV store (task history + runtime settings) lives in the app-data volume.
      QUARK_KV_PATH: "${QUARK_KV_PATH:-./data/kv.sqlite3}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      RECONNECT_INTERVAL_MS: "${RECONNECT_INTERVAL_MS:-5000}"
      CLIENT_IDLE_MINIMIZE_AFTER_MS: "${CLIENT_IDLE_MINIMIZE_AFTER_MS:-300000}"
      CLIENT_IDLE_STOP_AFTER_MS: "${CLIENT_IDLE_STOP_AFTER_MS:-900000}"
      CLIENT_IDLE_CHECK_INTERVAL_MS: "${CLIENT_IDLE_CHECK_INTERVAL_MS:-30000}"

    ports:
      # Public API + OpenAPI docs + MCP + noVNC page.
      - "${SERVER_PORT:-3000}:3000"
      # Raw VNC (x11vnc).
      - "5900:5900"
      # CDP proxy: DevTools page and host-side development.
      - "${CDP_PROXY_PORT:-9223}:9223"
      # Manager API: process lifecycle for external consumers.
      - "${QUARK_API_PORT:-8080}:8080"

    volumes:
      # Spark/AUR runtime data. This is the default runtime because the current
      # 6.6.7 installer crashes before creating a visible Electron window.
      - ./wine-data-spark:/opt/spark-bottle/drive_c/users/wineuser/Application Data/quark-cloud-drive
      - ./downloads:/opt/spark-bottle/drive_c/users/wineuser/Downloads
      # The KV store (task/download history) survives container restarts.
      - app-data:/opt/quark-app/data

    security_opt:
      - seccomp:unconfined

    cpus: "${DOCKER_CPUS:-2.0}"
    mem_limit: "${DOCKER_MEMORY:-4g}"
    shm_size: "2gb"

    healthcheck:
      # The app process is the health signal: when Quark is idle-stopped the
      # manager and the API are still up, so this stays healthy by design.
      test: [
        "CMD-SHELL",
        "curl -sf http://127.0.0.1:3000/healthz >/dev/null || exit 1",
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

volumes:
  app-data:
    driver: local
