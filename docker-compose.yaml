name: quark-cloud-drive

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ghcr.io/keiko233/quark-server:latest
    container_name: quark-server
    hostname: quark-server
    platform: linux/amd64

    devices:
      - /dev/dri:/dev/dri # Intel/AMD GPU

    environment:
      # Set before startup, e.g. MESA_LOADER_DRIVER_OVERRIDE=iris or radeonsi.
      MESA_LOADER_DRIVER_OVERRIDE: "${MESA_LOADER_DRIVER_OVERRIDE:-}"

      # Thin process manager (Deno). Idle policy moved to the client.
      QUARK_API_PORT: "${QUARK_API_PORT:-8080}"
      QUARK_AUTOSTART: "${QUARK_AUTOSTART:-true}"

    ports:
      # Raw VNC (x11vnc). noVNC UI is served by the client at /vnc.
      - "5900:5900"
      - "${CDP_PROXY_PORT:-9223}:9223"
      - "${QUARK_API_PORT:-8080}:8080"

    volumes:
      # Spark/AUR runtime data. This is the default runtime because the current
      # 6.6.7 installer crashes before creating a visible Electron window.
      - ./wine-data-spark:/opt/spark-bottle/drive_c/users/wineuser/Application Data/quark-cloud-drive
      - ./downloads:/opt/spark-bottle/drive_c/users/wineuser/Downloads

    security_opt:
      - seccomp:unconfined

    cpus: "${DOCKER_CPUS:-2.0}"
    mem_limit: "${DOCKER_MEMORY:-4g}"
    shm_size: "2gb"

    healthcheck:
      # Probe the manager, not the CDP port: when Quark is idle-stopped the
      # CDP port is intentionally down, but the manager itself is still up.
      test: [
        "CMD-SHELL",
        "curl -sf http://127.0.0.1:8080/healthz >/dev/null || exit 1",
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: ghcr.io/keiko233/quark-client:latest
    container_name: quark-client

    environment:
      # server is reachable by name on the compose network.
      SERVER_URL: "${SERVER_URL:-http://server:8080}"
      CDP_URL: "${CDP_URL:-http://server:9223}"
      VNC_URL: "${VNC_URL:-http://server:5900}"
      SERVER_PORT: "${SERVER_PORT:-3000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RECONNECT_INTERVAL_MS: "${RECONNECT_INTERVAL_MS:-5000}"
      CLIENT_IDLE_MINIMIZE_AFTER_MS: "${CLIENT_IDLE_MINIMIZE_AFTER_MS:-300000}"
      CLIENT_IDLE_STOP_AFTER_MS: "${CLIENT_IDLE_STOP_AFTER_MS:-1800000}"
      CLIENT_IDLE_CHECK_INTERVAL_MS: "${CLIENT_IDLE_CHECK_INTERVAL_MS:-10000}"

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "${SERVER_PORT:-3000}:3000"

    volumes:
      # Deno KV (task/download history) survives container restarts.
      - client-data:/app/apps/client/data

    security_opt:
      - seccomp:unconfined

    restart: unless-stopped

volumes:
  client-data:
    driver: local
