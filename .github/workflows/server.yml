name: Build quark-server

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: keiko233/quark-server

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Playwright Chromium
        run: deno task postinstall
        working-directory: apps/server

      - name: Download Quark installer
        run: deno task download-client
        working-directory: apps/server

      - name: Restore Spark deb cache
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: apps/server/.deb-cache
          key: spark-debs-${{ hashFiles('apps/server/scripts/download-debs.sh') }}

      - name: Download Spark debs
        run: ./scripts/download-debs.sh
        working-directory: apps/server

      - name: Compute Wine prefix cache key
        id: wp-key
        run: |
          installer_sha="$(sha256sum apps/server/installer.exe | awk '{print $1}' | cut -c1-16)"
          deepin_sha="$(sha256sum apps/server/.deb-cache/deepin-wine8.deb | awk '{print $1}' | cut -c1-16)"
          echo "key=wineprefix-$installer_sha-$deepin_sha" >> "$GITHUB_OUTPUT"

      - name: Restore Wine prefix cache
        id: wp-cache
        uses: actions/cache@v4
        with:
          path: apps/server/wineprefix.tar.zst
          key: ${{ steps.wp-key.outputs.key }}

      - name: Prepare Wine prefix
        if: steps.wp-cache.outputs.cache-hit != 'true'
        run: ./scripts/prepare-wineprefix.sh
        working-directory: apps/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
